# CAN logger configuration.
# This file is on the FAT boot partition: edit it from any computer, then
# power-cycle the logger. Format: key = value, "#" starts a comment.

# Name shown on the web page / Bluetooth
device_name = CAN logger

# --- CAN adapters --------------------------------------------------------
# Defaults for every adapter:
can.bitrate = 500000
# CAN FD data bitrate (0 = classic CAN only)
can.dbitrate = 0
# Listen-only: the logger never transmits and never ACKs. Keep this on for
# a car. Turn it off only on a bench with no other node to ACK frames.
can.listen_only = 1
# Set to 0 to leave the interface configuration to you (e.g. vcan)
can.autoconfig = 1
# Allow sending frames from the app on an adapter. The first frame sent
# switches that adapter out of listen-only (it then ACKs frames, one-shot
# transmission) until the app switches it back or the logger restarts.
# Normally set per adapter, e.g. can.004A00283235510F.tx = 1
can.tx = 0

# Per-adapter settings. The key is the adapter's USB serial number, the USB
# port path, or the interface name (can0, can1...), all shown on the web
# page under "Buses". Serial/port are stable, can0/can1 depend on plug order.
#can.004A00283235510F.bitrate = 250000
#can.004A00283235510F.label = Chassis CAN
#can.1-1.3.bitrate = 500000
#can.1-1.3.label = Powertrain CAN
#can.can1.dbitrate = 2000000

# --- storage -------------------------------------------------------------
# Raw ring partition (created automatically on first boot)
ring_device = /dev/mmcblk0p3
# RAM buffer used during power dips and if the card is slow (MiB)
ram_buffer_mb = 32
# Max time a frame waits in RAM before it is written (ms)
flush_ms = 1000

# --- power-fail input ----------------------------------------------------
# GPIO (BCM number) of the comparator / optocoupler that watches the 12 V
# input. Leave empty if not wired.
#powerfail_gpio = 17
# 1 = the line goes LOW when power fails
powerfail_active_low = 1
powerfail_pull_up = 0
# power must be back this long before writing resumes (engine cranking)
powerfail_restore_ms = 500

# --- system --------------------------------------------------------------
# reboot automatically if the logger hangs
watchdog = 1
# set the system clock (and the Pi 5 RTC) when a phone syncs the time
set_system_clock = 1
# initial name for recordings after boot (can be changed from the phone)
session_name =

# --- Wi-Fi hotspot -------------------------------------------------------
# on  = hotspot starts at boot
# off = hotspot stays off until switched on over Bluetooth
wifi = on
wifi_ssid = ET-18
# The real password is not kept in git: put it in
# buildroot/board/canlogger/local.conf (see local.conf.example) before
# building, or edit it here on the card. Without one the password is
# "canlogger". wifi_psk (64 hex digits, from `wpa_passphrase SSID PASSWORD`)
# can be used instead of the plain password.
#wifi_password =
#wifi_psk =
wifi_country = IT
wifi_channel = 6
wifi_ip = 192.168.4.1

# --- Bluetooth LE --------------------------------------------------------
ble = on
# default name is CANLog-XXXX
#ble_name = CANLog-car1

# --- app access and sending ------------------------------------------------
# PIN for commands from the app (Bluetooth) and for sending CAN frames
# (Wi-Fi and Bluetooth). Sending is refused while no PIN is set. Keep it in
# local.conf, not in git. (ble_pin is the old name and still works.)
#control_pin = 1234
# Web pages allowed to use the logger's HTTP API from the browser (the app
# on GitHub Pages; add http://localhost:8000 for development). Comma list.
app_origin = https://e-teamunipi.github.io
# Link to the app shown on the status page
#app_url = https://e-teamunipi.github.io/etfw-rpi-can-logger/

# --- misc ----------------------------------------------------------------
# SSH (dropbear) for debugging: root / password set at build time
ssh = on
# DHCP client on the Ethernet port (debugging)
ethernet = dhcp
