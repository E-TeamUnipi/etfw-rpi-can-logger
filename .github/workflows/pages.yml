# Publishes webapp/ (the analysis app: Bluetooth, Wi-Fi, log files) to
# GitHub Pages, with the WebAssembly engine built from crates/canlog-wasm.
# Repo settings -> Pages -> Source: GitHub Actions.
name: webapp
on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "crates/canlog-dbc/**"
      - "crates/canlog-analysis/**"
      - "crates/canlog-wasm/**"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Test the engine
        run: cargo test -p canlog-dbc -p canlog-analysis
      - name: Build the engine
        run: webapp/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
          # unique per attempt, so a re-run doesn't collide with the earlier upload
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
