# Publishes webapp/ (the Web Bluetooth app) to GitHub Pages.
# Repo settings -> Pages -> Source: GitHub Actions.
name: webapp
on:
  push:
    branches: [main]
    paths: ["webapp/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
          # unique per attempt, so a re-run doesn't collide with the earlier upload
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
